<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미디어캡슐</title>
<style>body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#F3F5F9;color:#1B2A4A;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}a{display:inline-block;margin-top:14px;background:#FF6B35;color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:700}</style>
</head>
<body>
<div><p>페이지를 찾을 수 없습니다.</p><a id="home" href="./">홈으로</a></div>
<script>
/* github.io 임시 주소에서는 /gacha.co.kr/ 아래에, 자체 도메인에서는 / 에 홈이 있음 */
var home = /github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
document.getElementById('home').href = home;
setTimeout(function(){ location.replace(home); }, 1500);
</script>
</body>
</html>
